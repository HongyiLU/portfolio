<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0d0a1c"/>
  <g font-family="sans-serif">
    <text x="400" y="90" text-anchor="middle" font-size="30" font-weight="700" fill="#eef4fb">选择一项强化</text>
    <g>
      <rect x="80" y="150" width="200" height="240" rx="12" fill="#140f2b" stroke="#9d8cff" stroke-width="2"/>
      <text x="180" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#9d8cff">重型化</text>
      <text x="180" y="250" text-anchor="middle" font-size="14" fill="#a89fd0">方块更重</text>
      <text x="180" y="276" text-anchor="middle" font-size="14" fill="#a89fd0">消除伤害更高</text>
    </g>
    <g>
      <rect x="300" y="150" width="200" height="240" rx="12" fill="#140f2b" stroke="#38e0c8" stroke-width="2"/>
      <text x="400" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#38e0c8">炸弹方块</text>
      <text x="400" y="250" text-anchor="middle" font-size="14" fill="#a89fd0">落地引爆</text>
      <text x="400" y="276" text-anchor="middle" font-size="14" fill="#a89fd0">清除周围方块</text>
    </g>
    <g>
      <rect x="520" y="150" width="200" height="240" rx="12" fill="#140f2b" stroke="#ffb454" stroke-width="2"/>
      <text x="620" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb454">连击大师</text>
      <text x="620" y="250" text-anchor="middle" font-size="14" fill="#a89fd0">combo 倍率</text>
      <text x="620" y="276" text-anchor="middle" font-size="14" fill="#a89fd0">大幅提升</text>
    </g>
  </g>
  <text x="60" y="470" font-family="sans-serif" font-size="17" fill="#6f6a99">截图占位 · 波次间的三选一构筑界面</text>
</svg>
